<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ALFA TZA LLP | Offer Letter Automation</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --red: #ff1e2d;
            --red-dark: #c70016;
            --white: #ffffff;
            --black: #050505;
            --card: #111111;
            --border: rgba(255, 255, 255, 0.08);
            --muted: #9ca3af;
            --success: #22c55e;
        }

        body {
            font-family: "Segoe UI", sans-serif;
            min-height: 100vh;

            background:
                radial-gradient(circle at top right,
                    rgba(255, 30, 45, 0.18),
                    transparent 22%),
                radial-gradient(circle at bottom left,
                    rgba(255, 30, 45, 0.12),
                    transparent 18%),
                linear-gradient(135deg, #000000, #090909, #111111);

            color: white;
            padding: 24px;
        }

        .wrapper {
            max-width: 850px;
            margin: auto;
        }

        .card {
            background: linear-gradient(145deg,
                    rgba(17, 17, 17, .96),
                    rgba(10, 10, 10, .96));

            border-radius: 26px;

            border: 1px solid var(--border);

            overflow: hidden;

            box-shadow:
                0 30px 80px rgba(0, 0, 0, .55),
                0 0 50px rgba(255, 30, 45, .06);
        }

        .topbar {
            padding: 34px 24px 28px;
            text-align: center;

            border-bottom: 1px solid var(--border);

            background:
                linear-gradient(180deg,
                    rgba(255, 30, 45, .05),
                    transparent),
                linear-gradient(135deg,
                    #111111,
                    #090909);
        }

        .logo {
            width: 170px;
            margin-bottom: 18px;
        }

        .title {
            font-size: 30px;
            font-weight: 800;
            letter-spacing: .3px;
        }

        .title span {
            color: var(--red);
        }

        .subtitle {
            margin-top: 10px;
            font-size: 14px;
            color: var(--muted);
        }

        .content {
            padding: 34px;
        }

        .login-box {
            text-align: center;
            margin-bottom: 30px;
        }

        .google-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;

            padding: 14px 22px;

            border-radius: 14px;

            background: white;
            color: black;

            text-decoration: none;

            font-weight: 700;

            transition: .25s;
        }

        .google-btn:hover {
            transform: translateY(-2px);
        }

        .user-box {
            background: rgba(255, 255, 255, .03);

            border: 1px solid var(--border);

            border-radius: 16px;

            padding: 14px 18px;

            margin-bottom: 24px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-email {
            font-size: 14px;
            color: #d1d5db;
        }

        .logout-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,.1);
            color: white;

            padding: 10px 14px;

            border-radius: 12px;

            cursor: pointer;
            transition: .2s;
        }

        .logout-btn:hover {
            border-color: rgba(255,255,255,.3);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .full {
            grid-column: span 2;
        }

        .field label {
            display: block;
            margin-bottom: 8px;

            font-size: 13px;
            font-weight: 700;
        }

        .field input,
        .field textarea,
        .field select {
            width: 100%;

            padding: 14px 15px;

            border-radius: 14px;

            border: 1px solid var(--border);

            background: linear-gradient(180deg,
                    #1a1a1a,
                    #111111);

            color: white;

            outline: none;

            transition: .22s;

            font-size: 15px;
        }

        .field textarea {
            resize: vertical;
            min-height: 100px;
        }

        .field input:focus,
        .field textarea:focus,
        .field select:focus {
            border-color: rgba(255, 30, 45, .7);

            box-shadow:
                0 0 0 4px rgba(255, 30, 45, .12),
                0 0 25px rgba(255, 30, 45, .08);
        }

        select option {
            background: #111111;
            color: white;
        }

        .hint {
            margin-top: 6px;
            font-size: 12px;
            color: var(--muted);
        }

        .btn {
            width: 100%;

            margin-top: 26px;

            border: none;

            padding: 17px;

            border-radius: 16px;

            cursor: pointer;

            font-size: 16px;
            font-weight: 800;

            color: white;

            background:
                linear-gradient(135deg,
                    var(--red),
                    var(--red-dark));

            transition: .25s;

            box-shadow:
                0 14px 30px rgba(255, 30, 45, .22);
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: .7;
            cursor: not-allowed;
        }

        .status {
            min-height: 24px;
            margin-top: 16px;

            text-align: center;

            font-size: 14px;
            font-weight: 600;
        }

        .loading {
            color: #d1d5db;
        }

        .success {
            color: var(--success);
        }

        .error {
            color: #ff4d5d;
        }

        .footer {
            text-align: center;

            margin-top: 18px;

            color: #71717a;

            font-size: 13px;
        }

        @media(max-width: 720px) {

            body {
                padding: 12px;
            }

            .content {
                padding: 18px;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: span 1;
            }

            .title {
                font-size: 24px;
            }

            .logo {
                width: 140px;
            }
        }
    </style>
</head>

<body>

    <div class="wrapper">

        <div class="card">

            <div class="topbar">

                <img src="/static/logo.png"
                    class="logo"
                    alt="ALFA TZA LLP">

                <div class="title">
                    Offer Letter <span>Automation</span>
                </div>

                <div class="subtitle">
                    Secure HR document generation & direct mail dispatch.
                </div>

            </div>

            <div class="content">

                {% if not session.get("user") %}

                <div class="login-box">

                    <a href="/login" class="google-btn">
                        Login with Google
                    </a>

                </div>

                {% else %}

                <div class="user-box">

                    <div class="user-email">
                        Logged in as:
                        <strong>{{ session["user"]["email"] }}</strong>
                    </div>

                    <button class="logout-btn"
                        onclick="window.location.href='/logout'">
                        Logout
                    </button>

                </div>

                <form id="offerForm">

                    <div class="grid">

                        <div class="field full">
                            <label>Candidate Name</label>

                            <input type="text"
                                id="name"
                                placeholder="Enter employee full name">
                        </div>

                        <div class="field">
                            <label>Employee Code</label>

                            <input type="text"
                                id="employee_code"
                                placeholder="Enter employee code">
                        </div>

                        <div class="field">
                            <label>Phone Number</label>

                            <input type="tel"
                                id="phone"
                                placeholder="Enter phone number">
                        </div>

                        <div class="field">
                            <label>Employee Email</label>

                            <input type="email"
                                id="email"
                                placeholder="employee@gmail.com">
                        </div>

                        <div class="field">
                            <label>Salary (₹)</label>

                            <input type="text"
                                id="salary"
                                placeholder="Enter salary">

                            <div class="hint">
                                Automatically formatted in Indian currency style.
                            </div>
                        </div>

                        <div class="field">
                            <label>Joining Date</label>

                            <input type="date"
                                id="joining">
                        </div>

                        <div class="field full">

                            <label>Residential Address</label>

                            <textarea id="address"
                                placeholder="Enter complete address"></textarea>

                        </div>

                        <div class="field">

                            <label>Role</label>

                            <select id="role">

                                <option value="">Select Role</option>

                                <option value="telecaller">
                                    Telecaller
                                </option>

                                <option value="team_leader">
                                    Team Leader
                                </option>

                                <option value="backend">
                                    Backend
                                </option>

                                <option value="hr">
                                    HR
                                </option>

                                <option value="data_analyst">
                                    Data Analyst
                                </option>

                            </select>

                        </div>

                        <div class="field">

                            <label>Branch</label>

                            <select id="branch">

                                <option value="">Select Branch</option>

                                <option value="vashi">
                                    Vashi
                                </option>

                                <option value="thane">
                                    Thane
                                </option>

                                <option value="virar">
                                    Virar
                                </option>

                            </select>

                        </div>

                    </div>

                    <button type="button"
                        class="btn"
                        id="generateBtn"
                        onclick="generateAndSend()">

                        Generate PDF + Send Email

                    </button>

                    <div class="status"
                        id="status"></div>

                </form>

                {% endif %}

            </div>

        </div>

        <div class="footer">
            ALFA TZA LLP • Internal HR Utility
        </div>

    </div>

    <script>

        const salaryInput = document.getElementById("salary");

        if (salaryInput) {

            salaryInput.addEventListener("input", function () {

                let raw = this.value
                    .replace(/,/g, "")
                    .replace(/\D/g, "");

                if (!raw) {
                    this.value = "";
                    return;
                }

                this.value = Number(raw)
                    .toLocaleString("en-IN");

            });

        }

        async function generateAndSend() {

            const btn = document.getElementById("generateBtn");
            const status = document.getElementById("status");

            const data = {

                name:
                    document.getElementById("name")
                    .value.trim(),

                employee_code:
                    document.getElementById("employee_code")
                    .value.trim(),

                phone:
                    document.getElementById("phone")
                    .value.trim(),

                email:
                    document.getElementById("email")
                    .value.trim(),

                address:
                    document.getElementById("address")
                    .value.trim(),

                role:
                    document.getElementById("role")
                    .value,

                branch:
                    document.getElementById("branch")
                    .value,

                salary:
                    document.getElementById("salary")
                    .value.replace(/,/g, "")
                    .trim(),

                joining:
                    document.getElementById("joining")
                    .value
            };

            for (let key in data) {

                if (!data[key]) {

                    status.className = "status error";

                    status.innerText =
                        "Complete all fields.";

                    return;
                }
            }

            try {

                btn.disabled = true;

                btn.innerText =
                    "Generating & Sending...";

                status.className =
                    "status loading";

                status.innerText =
                    "Creating PDF and sending mail from hr@alfatza.com ...";

                const response = await fetch("/generate", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(data)

                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(
                        result.error || "Something failed."
                    );
                }

                status.className =
                    "status success";

                status.innerText =
                    result.message;

                document.getElementById("offerForm").reset();

            }

            catch (error) {

                status.className =
                    "status error";

                status.innerText =
                    error.message;

            }

            finally {

                btn.disabled = false;

                btn.innerText =
                    "Generate PDF + Send Email";
            }
        }

    </script>

</body>


</html>
