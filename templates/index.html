<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALFA TZA LLP | Offer Letter Generator</title>

<style>
/* ===== SAME DESIGN (UNCHANGED) ===== */
*{margin:0;padding:0;box-sizing:border-box;}

:root{
--red:#ff1e2d;
--red-dark:#c70016;
--white:#ffffff;
--black:#050505;
--card:#111111;
--border:rgba(255,255,255,0.08);
--muted:#a1a1aa;
--success:#22c55e;
}

body{
font-family:"Segoe UI",Arial;
min-height:100vh;
background:
radial-gradient(circle at top right, rgba(255,30,45,.22), transparent 25%),
radial-gradient(circle at bottom left, rgba(255,30,45,.14), transparent 22%),
linear-gradient(135deg,#000,#090909,#0d0d0d);
color:white;
padding:24px;
}

.wrapper{max-width:820px;margin:auto;}

.card{
background:linear-gradient(145deg,#111,#0a0a0a);
border:1px solid var(--border);
border-radius:24px;
overflow:hidden;
box-shadow:0 25px 70px rgba(0,0,0,.55);
}

.topbar{
text-align:center;
padding:34px 24px;
border-bottom:1px solid var(--border);
}

.logo{width:170px;margin-bottom:16px;}

.title{font-size:30px;font-weight:800;}
.title span{color:var(--red);}

.subtitle{color:var(--muted);font-size:14px;}

.content{padding:32px;}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:18px;
}

.full{grid-column:span 2;}

.field label{
font-size:13px;
font-weight:700;
margin-bottom:6px;
display:block;
}

.field input,.field textarea,.field select{
width:100%;
padding:14px;
border-radius:14px;
border:1px solid var(--border);
background:#111;
color:white;
}

.btn{
width:100%;
margin-top:24px;
padding:16px;
border:none;
border-radius:16px;
font-weight:800;
background:linear-gradient(135deg,var(--red),var(--red-dark));
color:white;
cursor:pointer;
}

.status{
margin-top:16px;
text-align:center;
font-weight:600;
}

.success{color:var(--success);}
.error{color:#ff4d5d;}

.user-box{
display:flex;
justify-content:space-between;
margin-bottom:20px;
padding:10px;
border:1px solid var(--border);
border-radius:12px;
}

.logout-btn{
background:none;
border:1px solid var(--border);
color:white;
padding:6px 12px;
cursor:pointer;
}
</style>
</head>

<body>

<div class="wrapper">
<div class="card">

<div class="topbar">
<img src="/static/logo.png" class="logo">
<div class="title">Offer Letter <span>Generator</span></div>
<div class="subtitle">Secure HR System</div>
</div>

<div class="content">

{% if not session.get("user") %}

<!-- LOGIN -->
<div style="text-align:center;">
<a href="/login" class="btn">Login with Google</a>
</div>

{% else %}

<!-- USER INFO -->
<div class="user-box">
<div>{{ session["user"]["email"] }}</div>
<button class="logout-btn" onclick="window.location='/logout'">Logout</button>
</div>

<form id="offerForm">

<div class="grid">

<div class="field full">
<label>Name</label>
<input id="name">
</div>

<div class="field">
<label>Employee Code</label>
<input id="employee_code">
</div>

<div class="field">
<label>Phone</label>
<input id="phone">
</div>

<div class="field">
<label>Email</label>
<input id="email">
</div>

<div class="field">
<label>Salary</label>
<input id="salary">
</div>

<div class="field">
<label>Joining</label>
<input type="date" id="joining">
</div>

<div class="field full">
<label>Address</label>
<textarea id="address"></textarea>
</div>

<div class="field">
<label>Role</label>
<select id="role">
<option value="">Select</option>
<option value="telecaller">Telecaller</option>
<option value="team_leader">Team Leader</option>
<option value="backend">Backend</option>
<option value="hr">HR</option>
<option value="data_analyst">Data Analyst</option>
</select>
</div>

<div class="field">
<label>Branch</label>
<select id="branch">
<option value="">Select</option>
<option value="vashi">Vashi</option>
<option value="thane">Thane</option>
<option value="virar">Virar</option>
</select>
</div>

</div>

<button type="button" class="btn" id="generateBtn" onclick="generatePDF()">
Generate Offer Letter
</button>

<div class="status" id="status"></div>

</form>

{% endif %}

</div>
</div>
</div>

<script>
// salary format
document.getElementById("salary")?.addEventListener("input",function(){
let v=this.value.replace(/,/g,"").replace(/\D/g,"");
this.value=v?Number(v).toLocaleString("en-IN"):"";
});

async function generatePDF(){

const btn=document.getElementById("generateBtn");
const status=document.getElementById("status");

const data={
name:name.value.trim(),
employee_code:employee_code.value.trim(),
phone:phone.value.trim(),
email:email.value.trim(),
address:address.value.trim(),
role:role.value,
branch:branch.value,
salary:salary.value.replace(/,/g,""),
joining:joining.value
};

for(let k in data){
if(!data[k]){
status.className="status error";
status.innerText="Fill all fields";
return;
}
}

try{

btn.disabled=true;
btn.innerText="Processing...";
status.innerText="Generating PDF...";

const res=await fetch("/generate",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(data)
});

const result=await res.json();

if(!res.ok) throw new Error(result.error);

status.className="status success";
status.innerText="Done! Download + Mail ready.";


// ✅ DOWNLOAD
window.location.href=result.download_url;


// ✅ OPEN MAIL CLIENT
setTimeout(()=>{
window.open(result.mailto,"_blank");
},800);

document.getElementById("offerForm").reset();

}catch(e){
status.className="status error";
status.innerText=e.message;
}

btn.disabled=false;
btn.innerText="Generate Offer Letter";
}
</script>

</body>
</html>
