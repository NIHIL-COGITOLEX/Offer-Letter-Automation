<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ALFA TZA LLP | Offer Letter Automation</title>

    <style>
        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            font-family: "Segoe UI", sans-serif;
            background: linear-gradient(135deg,#000,#111);
            color:white;
            padding:20px;
        }

        .container {
            max-width:800px;
            margin:auto;
        }

        .card {
            background:#111;
            padding:25px;
            border-radius:16px;
        }

        h1 {
            text-align:center;
            margin-bottom:20px;
        }

        input, select, textarea {
            width:100%;
            padding:12px;
            margin-top:8px;
            margin-bottom:14px;
            border-radius:10px;
            border:1px solid #333;
            background:#1a1a1a;
            color:white;
        }

        button {
            width:100%;
            padding:14px;
            border:none;
            border-radius:12px;
            background:#ff1e2d;
            color:white;
            font-weight:bold;
            cursor:pointer;
        }

        button:hover {
            background:#c70016;
        }

        .actions {
            margin-top:20px;
            display:none;
            gap:10px;
        }

        .actions button {
            flex:1;
        }

        .status {
            text-align:center;
            margin-top:15px;
        }

        .success { color:#22c55e; }
        .error { color:#ff4d5d; }

    </style>
</head>

<body>

<div class="container">
<div class="card">

<h1>Offer Letter Automation</h1>

{% if not session.get("user") %}

    <a href="/login">
        <button>Login with Google</button>
    </a>

{% else %}

    <p style="margin-bottom:15px;">
        Logged in as: <b>{{ session["user"]["email"] }}</b>
    </p>

    <button onclick="window.location.href='/logout'">Logout</button>

    <hr style="margin:20px 0;">

    <form id="form">

        <input id="name" placeholder="Candidate Name">
        <input id="employee_code" placeholder="Employee Code">
        <input id="phone" placeholder="Phone">
        <input id="email" placeholder="Employee Email">

        <input id="salary" placeholder="Salary">
        <input type="date" id="joining">

        <textarea id="address" placeholder="Address"></textarea>

        <select id="role">
            <option value="">Select Role</option>
            <option value="telecaller">Telecaller</option>
            <option value="team_leader">Team Leader</option>
            <option value="backend">Backend</option>
            <option value="hr">HR</option>
            <option value="data_analyst">Data Analyst</option>
        </select>

        <select id="branch">
            <option value="">Select Branch</option>
            <option value="vashi">Vashi</option>
            <option value="thane">Thane</option>
            <option value="virar">Virar</option>
        </select>

        <button type="button" onclick="generate()">Generate Offer Letter</button>

    </form>

    <div class="actions" id="actions">
        <button onclick="downloadPDF()">Download PDF</button>
        <button onclick="openMail()">Open Email</button>
    </div>

    <div class="status" id="status"></div>

{% endif %}

</div>
</div>

<script>

let downloadUrl = "";
let mailtoLink = "";

async function generate() {

    const status = document.getElementById("status");
    const actions = document.getElementById("actions");

    const data = {
        name: name.value,
        employee_code: employee_code.value,
        phone: phone.value,
        email: email.value,
        address: address.value,
        role: role.value,
        branch: branch.value,
        salary: salary.value,
        joining: joining.value
    };

    for (let key in data) {
        if (!data[key]) {
            status.className = "status error";
            status.innerText = "Fill all fields";
            return;
        }
    }

    try {

        status.innerText = "Generating PDF...";
        status.className = "status";

        const res = await fetch("/generate", {
            method: "POST",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify(data)
        });

        const result = await res.json();

        if (!res.ok) throw new Error(result.error);

        downloadUrl = result.download_url;

        // 🔥 VERY IMPORTANT: encode mailto properly
        mailtoLink = encodeURI(result.mailto);

        status.className = "status success";
        status.innerText = "PDF Ready. Download & Send Email.";

        actions.style.display = "flex";

    } catch (err) {
        status.className = "status error";
        status.innerText = err.message;
    }
}

function downloadPDF() {
    window.open(downloadUrl, "_blank");
}

function openMail() {
    window.location.href = mailtoLink;
}

</script>

</body>
</html>
