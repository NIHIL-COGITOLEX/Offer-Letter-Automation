<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ALFA TZA LLP | Offer Letter Generator</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

:root{
--red:#ff1e2d;
--red-dark:#c70016;
--white:#ffffff;
--black:#050505;
--card:#111111;
--card2:#171717;
--border:rgba(255,255,255,0.08);
--muted:#a1a1aa;
--success:#22c55e;
}

body{
font-family:"Segoe UI",Arial,sans-serif;
min-height:100vh;
background:
radial-gradient(circle at top right, rgba(255,30,45,.22), transparent 25%),
radial-gradient(circle at bottom left, rgba(255,30,45,.14), transparent 22%),
linear-gradient(135deg,#000,#090909,#0d0d0d);
color:white;
padding:24px;
}

.wrapper{max-width:920px;margin:auto;}

.card{
background:linear-gradient(145deg,#111,#0a0a0a);
border:1px solid var(--border);
border-radius:24px;
overflow:hidden;
box-shadow:0 25px 70px rgba(0,0,0,.55);
}

.topbar{
text-align:center;
padding:30px;
border-bottom:1px solid var(--border);
}

.logo{
width:160px;
margin-bottom:14px;
}

.title{
font-size:28px;
font-weight:800;
}
.title span{color:var(--red);}

.subtitle{
color:var(--muted);
font-size:14px;
margin-top:8px;
}

.content{padding:30px;}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:16px;
}

.full{grid-column:span 2;}

.field label{
font-size:13px;
font-weight:700;
margin-bottom:6px;
display:block;
}

.field input,.field textarea,.field select{
width:100%;
padding:14px;
border-radius:12px;
border:1px solid var(--border);
background:#111;
color:white;
outline:none;
}

.field textarea{min-height:90px;}

.field input:focus,.field textarea:focus,.field select:focus{
border-color:rgba(255,30,45,.7);
box-shadow:0 0 0 3px rgba(255,30,45,.1);
}

.hint{
font-size:12px;
color:var(--muted);
margin-top:5px;
}

.btn{
width:100%;
margin-top:20px;
padding:16px;
border:none;
border-radius:14px;
font-weight:800;
background:linear-gradient(135deg,var(--red),var(--red-dark));
color:white;
cursor:pointer;
transition:.2s;
}

.btn:hover{transform:translateY(-1px);}
.btn:disabled{opacity:.7;cursor:not-allowed;}

.status{
margin-top:14px;
text-align:center;
font-weight:600;
}

.loading{color:#ccc;}
.error{color:#ff4d5d;}
.success{color:var(--success);}

.footer{
text-align:center;
color:#777;
margin-top:20px;
font-size:13px;
}

@media(max-width:720px){
.grid{grid-template-columns:1fr;}
.full{grid-column:span 1;}
}
</style>
</head>

<body>

<div class="wrapper">
<div class="card">

<div class="topbar">
<img src="/static/logo.png" class="logo">
<div class="title">Offer Letter <span>Generator</span></div>
<div class="subtitle">HR work, now slightly less miserable.</div>
</div>

<div class="content">

<form id="offerForm">

<div class="grid">

<div class="field full">
<label>Candidate Name</label>
<input id="name" placeholder="Full name">
</div>

<div class="field">
<label>Employee Code</label>
<input id="employee_code">
</div>

<div class="field">
<label>Phone</label>
<input id="phone">
</div>

<div class="field">
<label>Email</label>
<input id="email" type="email" placeholder="candidate@email.com">
</div>

<div class="field">
<label>Salary</label>
<input id="salary">
<div class="hint">Auto formats ₹ values</div>
</div>

<div class="field">
<label>Joining Date</label>
<input type="date" id="joining">
</div>

<div class="field full">
<label>Address</label>
<textarea id="address"></textarea>
</div>

<div class="field">
<label>Role</label>
<select id="role">
<option value="">Select</option>
<option value="telecaller">Telecaller</option>
<option value="team_leader">Team Leader</option>
<option value="backend">Backend</option>
<option value="hr">HR</option>
<option value="data_analyst">Data Analyst</option>
</select>
</div>

<div class="field">
<label>Branch</label>
<select id="branch">
<option value="">Select</option>
<option value="vashi">Vashi</option>
<option value="thane">Thane</option>
<option value="virar">Virar</option>
</select>
</div>

</div>

<button type="button" id="generateBtn" class="btn" onclick="generatePDF()">
Generate Offer Letter
</button>

<div id="status" class="status"></div>

</form>

</div>
</div>

<div class="footer">ALFA TZA LLP • Internal Tool</div>
</div>

<script>

// ===== Salary Formatter =====
document.getElementById("salary").addEventListener("input", function(){
let raw=this.value.replace(/,/g,"").replace(/\D/g,"");
this.value=raw?Number(raw).toLocaleString("en-IN"):"";
});

// ===== Main Logic =====
async function generatePDF(){

const btn=document.getElementById("generateBtn");
const status=document.getElementById("status");

const data={
name:document.getElementById("name").value.trim(),
employee_code:document.getElementById("employee_code").value.trim(),
phone:document.getElementById("phone").value.trim(),
email:document.getElementById("email").value.trim(),
address:document.getElementById("address").value.trim(),
role:document.getElementById("role").value,
branch:document.getElementById("branch").value,
salary:document.getElementById("salary").value.replace(/,/g,""),
joining:document.getElementById("joining").value
};

// ===== Validation =====
for(let k in data){
if(!data[k]){
status.className="status error";
status.innerText="Fill all fields. This isn't optional.";
return;
}
}

try{

btn.disabled=true;
btn.innerText="Generating...";
status.className="status loading";
status.innerText="Generating PDF...";

const res=await fetch("/generate",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(data)
});

if(!res.ok){
let errText="Server error";
try{
const err=await res.json();
errText=err.error||errText;
}catch{}
throw new Error(errText);
}

// ===== GET MAILTO HEADER =====
const mailto=res.headers.get("X-Mailto");

// ===== DOWNLOAD PDF =====
const blob=await res.blob();
const url=window.URL.createObjectURL(blob);

const a=document.createElement("a");
a.href=url;
a.download=`${data.name}_Offer_Letter.pdf`;
document.body.appendChild(a);
a.click();
a.remove();

// ===== OPEN MAIL =====
setTimeout(()=>{
if(mailto){
window.location.href=mailto;
}
},1000);

status.className="status success";
status.innerText="PDF ready. Mail draft opening...";

setTimeout(()=>{
document.getElementById("offerForm").reset();
},1200);

}catch(e){
status.className="status error";
status.innerText=e.message;
}

btn.disabled=false;
btn.innerText="Generate Offer Letter";
}

</script>

</body>
</html>
